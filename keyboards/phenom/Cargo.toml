[package]
name = "phenom"
version = "0.1.0"
description = "RMK wired split firmware for Ergohaven Phenom Series (RP2040)"
homepage = "https://github.com/ergohaven/rmk"
repository = "https://github.com/ergohaven/rmk"
edition = "2021"
license = "MIT OR Apache-2.0"
autotests = false
autobenches = false
autoexamples = false

# Prevent cargo from looking for a workspace above this directory
[workspace]
members = ["."]

[[bin]]
name = "central"
path = "src/central.rs"
test = false
bench = false

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
test = false
bench = false

[dependencies]
rmk = { path = "../../rmk", default-features = false, features = [
    "defmt",
    "host_lock",
    "rp2040",
    "split",
    "storage",
    "vial",
    "watchdog",
] }

embassy-executor = { version = "0.10", features = [
    "defmt",
    "executor-thread",
    "platform-cortex-m",
] }
embassy-futures = { version = "0.1", features = ["defmt"] }
embassy-rp = { version = "0.10", features = [
    "critical-section-impl",
    "defmt",
    "rp2040",
    "time-driver",
] }
embassy-time = { version = "0.5", features = ["defmt"] }

cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2"

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
