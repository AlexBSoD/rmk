# Phenom Series — Phenom Micro profile.
[keyboard]
name = "Ergohaven Phenom Micro"
product_name = "Phenom Micro"
vendor_id = 0xE126
product_id = 0x0054
manufacturer = "Ergohaven"
chip = "rp2040"

[host]
vial_enabled = true
# QMK VIAL_UNLOCK_COMBO_ROWS/COLS.
unlock_keys = [[1, 4], [1, 3]]

[layout]
rows = 10
cols = 8
# Phenom Mini matrix without the outer columns (column 5 on both halves).
map = """
(1,4,L) (1,3,L) (1,2,L) (1,1,L) (1,0,L)    (6,0,R) (6,1,R) (6,2,R) (6,3,R) (6,4,R)
(2,4,L) (2,3,L) (2,2,L) (2,1,L) (2,0,L)    (7,0,R) (7,1,R) (7,2,R) (7,3,R) (7,4,R)
(3,4,L) (3,3,L) (3,2,L) (3,1,L) (3,0,L)    (8,0,R) (8,1,R) (8,2,R) (8,3,R) (8,4,R)
(4,3,*) (4,2,*) (2,7,*) (1,7,*) (0,7,*)    (5,7,*) (6,7,*) (7,7,*) (9,2,*) (9,3,*)
                                (4,7,*)    (9,7,*)
"""

[keymap]
layers = 16

# The QMK home-row mods with shifted taps (HRM_*) become MT() with a SHIFTED()
# tap; HRM_GUI_SCR is MT(User29, LGui) on the left and MT(User29, RGui) on the
# right, as QMK picks the GUI side from the key's half.
[[keymap.layer]]
name = "Base"
keys = """
Q           W           E             R            T       Y      U            I             O            P
MT(A,LGui)  MT(S,LAlt)  MT(D,LShift)  MT(F,LCtrl)  G       H      MT(J,RCtrl)  MT(K,RShift)  MT(L,RAlt)   MT(Semicolon,RGui)
Z           X           C             V            B       N      M            Comma         Dot          Quote
Grave       Escape      Backspace     MO(1)        Space   Enter  MO(2)        Tab           LeftBracket  RightBracket
                                      AudioMute    AudioMute
"""
# encoders: [left, right], each [clockwise, counter-clockwise]
encoders = [["AudioVolUp", "AudioVolDown"], ["AudioVolUp", "AudioVolDown"]]

[[keymap.layer]]
name = "Lower"
keys = """
Kc1            Kc2              Kc3               Kc4             Kc5           Kc6  Kc7             Kc8              Kc9            Kc0
MT(Home,LGui)  MT(Insert,LAlt)  MT(Delete,LShift) MT(End,LCtrl)   Enter         _    MT(Left,RCtrl)  MT(Down,RShift)  MT(Up,RAlt)    MT(Right,RGui)
_              _                _                 _               PrintScreen   _    _               _                _              _
PageUp         PageDown         _                 _               _             _    MO(3)           _                CapsLock       CapsWordToggle
                                                  _   _
"""
# QMK RGB_VAD/RGB_VAI: no RGB support yet.
encoders = [["_", "_"], ["_", "_"]]

[[keymap.layer]]
name = "Raise"
# All shifted chars use SHIFTED() — RMK applies LShift automatically
keys = """
SHIFTED(Kc2)        SHIFTED(Comma)               Equal              SHIFTED(Dot)                 Grave           SHIFTED(Kc6)  SHIFTED(Quote)                     SHIFTED(Minus)        Quote                               _
MT(Backslash,LGui)  MT(SHIFTED(Kc9),LAlt)        MT(Minus,LShift)   MT(SHIFTED(Kc0),LCtrl)       SHIFTED(Equal)  SHIFTED(Kc5)  MT(SHIFTED(LeftBracket),RCtrl)     MT(Semicolon,RShift)  MT(SHIFTED(RightBracket),RAlt)      MT(SHIFTED(Kc1),RGui)
SHIFTED(Kc3)        SHIFTED(Kc8)                 SHIFTED(Semicolon) Slash                        _               _             SHIFTED(Backslash)                 SHIFTED(Grave)        SHIFTED(Kc7)                        SHIFTED(Kc4)
_  _  _  MO(3)  _    _  _  _  _  _
_  _
"""
encoders = [["Right", "Left"], ["Right", "Left"]]

[[keymap.layer]]
name = "Adjust"
keys = """
F1    F2                       F3                        F4                       F5    F6  F7                      F8                    F9                    F10
LGui  MT(MediaPrevTrack,LAlt)  MT(MediaPlayPause,LShift) MT(MediaNextTrack,LCtrl) _     _   MT(AudioVolDown,RCtrl)  MT(AudioMute,RShift)  MT(AudioVolUp,RAlt)   MT(F11,RGui)
_     _                        _                         _                        _     _   _                       _                     _                     F12
_  _  _  _  _    _  _  _  _  _
_  _
"""
encoders = [["MouseWheelUp", "MouseWheelDown"], ["MouseWheelUp", "MouseWheelDown"]]

[[keymap.layer]]
name = "Pointing"
# User28 = Sniper, User29 = Scroll, User30 = Text (EH_SNP/EH_SCR/EH_TXT).
keys = """
_                _          _          _          _         _       _          _          _          _
MT(User29,LGui)  MouseBtn3  MouseBtn2  MouseBtn1  User28    User28  MouseBtn1  MouseBtn2  MouseBtn3  MT(User29,RGui)
_                _          _          _          User30    User30  _          _          _          _
_  _  _  _  _    _  _  _  _  _
_  _
"""
encoders = [["MouseWheelUp", "MouseWheelDown"], ["MouseWheelUp", "MouseWheelDown"]]

[[behavior.auto_mouse_layer]]
# QMK AUTO_MOUSE_DEFAULT_LAYER 4 with the default 750 ms timeout.
target_layer = 4
timeout = "750ms"
threshold = 2

[storage]
# RP2040 default: the settings area starts at 1 MiB of the 2 MiB flash.

[event]
# Four PointingProcessors (two trackballs, two touchpads) plus the auto mouse
# layer runner. PointingProcessorEvent and PointingTransformEvent share this count.
pointing.subs = 5
# The split link and the auto mouse layer runner.
layer_change.subs = 2

[split]
connection = "serial"

[split.central]
rows = 5
cols = 8
row_offset = 0
col_offset = 0
# Full-duplex USART, the cable crosses TX and RX.
serial = [{ instance = "UART0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["PIN_6", "PIN_5", "PIN_4", "PIN_3", "PIN_2"]
col_pins = ["PIN_7", "PIN_12", "PIN_13", "PIN_14", "PIN_15", "PIN_16", "PIN_17", "PIN_18"]
bootmagic = [1, 4]

[[split.central.input_device.encoder]]
pin_a = "PIN_24"
pin_b = "PIN_23"
phase = "resolution"
resolution = 4
internal_pullup = true

# The module slot takes a trackball or a touchpad. Both drivers run; the one
# without hardware gives up (PMW3610) or keeps retrying once a second (IQS5xx).
# Device ids follow QMK: left ball, right ball, left touch, right touch.
[[split.central.input_device.pmw3610]]
name = "left_ball"
id = 0
spi.instance = "bitbang0"
spi.sck = "PIN_10"
spi.mosi = "PIN_11"
spi.miso = "PIN_11"
spi.cs = "PIN_9"
cpi = 400
# QMK default: ROT_90, then Y inverted.
proc_invert_x = true
proc_invert_y = true
proc_swap_xy = true

[[split.central.input_device.iqs5xx]]
name = "left_touch"
id = 2
i2c.instance = "I2C0"
i2c.sda = "PIN_20"
i2c.scl = "PIN_21"
# QMK default: AZOTEQ_IQS5XX_ROTATION_270 (FLIP_X | SWITCH_XY), then ROT_180 for
# the left touchpad. The RMK driver already sets FLIP_X.
proc_invert_x = true
proc_invert_y = true
proc_swap_xy = true

[[split.peripheral]]
rows = 5
cols = 8
row_offset = 5
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_0", rx_pin = "PIN_1" }]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["PIN_6", "PIN_5", "PIN_4", "PIN_3", "PIN_2"]
col_pins = ["PIN_7", "PIN_12", "PIN_13", "PIN_14", "PIN_15", "PIN_16", "PIN_17", "PIN_18"]
bootmagic = [1, 4]

[[split.peripheral.input_device.encoder]]
pin_a = "PIN_24"
pin_b = "PIN_23"
phase = "resolution"
resolution = 4
internal_pullup = true

[[split.peripheral.input_device.pmw3610]]
name = "right_ball"
id = 1
spi.instance = "bitbang0"
spi.sck = "PIN_10"
spi.mosi = "PIN_11"
spi.miso = "PIN_11"
spi.cs = "PIN_9"
cpi = 400
proc_invert_x = true
proc_invert_y = true
proc_swap_xy = true

[[split.peripheral.input_device.iqs5xx]]
name = "right_touch"
id = 3
i2c.instance = "I2C0"
i2c.sda = "PIN_20"
i2c.scl = "PIN_21"
# QMK default: AZOTEQ_IQS5XX_ROTATION_270 (FLIP_X | SWITCH_XY). The RMK driver
# already sets FLIP_X.
proc_swap_xy = true
