[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip nRF52840_xxAA"
linker = "flip-link"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"
KEYBOARD_TOML_PATH = { value = "keyboard_mini_v31.toml", relative = true }
VIAL_JSON_PATH = { value = "vial_mini_v31.json", relative = true }
