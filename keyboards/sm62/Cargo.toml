[package]
name = "sm62"
version = "0.1.0"
description = "Ergohaven Space Mission 62 (RP2040, wired split, Rynk)"
homepage = "https://github.com/ergohaven/rmk"
repository = "https://github.com/ergohaven/rmk"
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"
autotests = false
autobenches = false
autoexamples = false

[features]
default = ["protocol_rynk"]
protocol_rynk = ["rmk/ergohaven_rynk"]
protocol_vial = ["rmk/vial", "rmk/host_lock"]
vial_standalone = ["protocol_vial", "standalone"]
standalone = ["rmk/defmt"]
usb_debug = ["rmk/usb_log"]
# Phase 1: ST7789 240x280 display.
display = ["rmk/display", "dep:rmk-types"]

[dependencies]
rmk = { path = "../../rmk", default-features = false, features = [
    "storage",
    "split",
    "rp2040",
    "async_matrix",
] }
rmk-types = { path = "../../rmk-types", optional = true }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "central"
path = "src/central.rs"
test = false
bench = false

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = false
opt-level = "z"
overflow-checks = false
lto = "fat"
strip = "symbols"

# Prevent cargo from looking for a workspace above this directory
[workspace]
members = ["."]
